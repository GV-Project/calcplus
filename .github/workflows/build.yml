name: Gerar APK e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Criar estrutura Android sem perder o código
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.calcplus --project-name calc_plus .
          rm -rf lib && cp -r /tmp/lib lib && cp /tmp/pubspec.yaml pubspec.yaml
      - name: Permissão de internet e nome do app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Calc+"#' $M
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # Só arm64 (quase todo celular atual): deixa o APK pequeno o bastante para o Cloudflare.
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: calcplus-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  deploy:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calcplus-apk
          path: worker/public
      - name: Renomear APK
        run: mv worker/public/app-release.apk worker/public/calcplus.apk
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          preCommands: npx wrangler d1 execute calcplus --remote --file=schema.sql
          command: deploy
          secrets: |
            SETUP_KEY
            DL_ANSWER
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
          DL_ANSWER: ${{ secrets.DL_ANSWER }}
